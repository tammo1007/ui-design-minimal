<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>UI Design Minimal</title>
    <meta name="description" content="Apple-like minimal design system with Liquid Glass controls for landing pages and product UI, written so AI coding agents follow it exactly." />
    <meta name="author" content="Tammo Elsner" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script>
      // theme before first paint: saved choice, else the OS setting. Toggle sets localStorage "lg-theme".
      (function () {
        try {
          var t = localStorage.getItem("lg-theme");
          if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/demo/landing/main.tsx"></script>
  </body>
</html>
